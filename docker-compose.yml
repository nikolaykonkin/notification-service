# Локальный стенд: PostgreSQL, Redis, Kafka и сервис
# Пароли ниже подходят только для локальной учебной среды
name: notification-service

services:
  # PostgreSQL: история уведомлений
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification
    ports:
      - "5432:5432"
    volumes:
      # Именованный том: данные переживают пересоздание контейнера
      - pgdata:/var/lib/postgresql/data
      # Миграции выполняются автоматически, но только на пустой базе
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis: кэш статусов и rate limiting
  # Том не нужен: это кэш
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka: один брокер в режиме KRaft (без ZooKeeper)
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092" # доступ с хоста: localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Три точки подключения (listeners) брокера:
      #   HOST       порт 9092   для клиентов с нашей машины (go run)
      #   INTERNAL   порт 19092  для клиентов из других контейнеров
      #   CONTROLLER порт 9093   служебный, для внутренней работы KRaft
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      # Адреса, которые брокер сообщает клиентам для дальнейшего подключения
      # (advertised listeners): с хоста это localhost, из контейнеров это kafka
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Брокер один, поэтому реплик служебных топиков тоже одна
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Одноразовый контейнер: создает топики и завершается
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic notifications.email --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic notifications.push --partitions 3 --replication-factor 1

  # Сам сервис, собирается из Dockerfile
  # Внутри compose адреса других сервисов это имена сервисов
  # Kafka доступна как kafka:19092 (listener INTERNAL)
  notification-service:
    build: .
    image: notification-service:local
    environment:
      DATABASE_URL: "postgres://notification:notification@postgres:5432/notification?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BROKERS: "kafka:19092"
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
      RATE_LIMIT_PER_HOUR: "10"
    ports:
      - "50051:50051"
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    # Если процесс завершился с ошибкой (например, упал consumer), Docker поднимет его заново
    restart: unless-stopped

  # Prometheus: забирает метрики сервиса и хранит их во времени
  prometheus:
    image: prom/prometheus:v3.5.5
    ports:
      - "127.0.0.1:9090:9090" # только с твоей машины
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - notification-service

  # Grafana: графики по данным из Prometheus
  # Источник данных подключается через provisioning
  grafana:
    image: grafana/grafana:12.0.0
    environment:
      # Только для локального стенда. Порт открыт лишь на 127.0.0.1
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
  grafanadata: