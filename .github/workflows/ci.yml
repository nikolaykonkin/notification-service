name: CI

# Запуск на push в main и на любые pull request
on:
  push:
    branches: [main]
  pull_request:

# Минимальные права: токен может только читать репозиторий
permissions:
  contents: read

jobs:
  # Быстрые проверки без внешних сервисов
  # Тесты, которым нужны PostgreSQL, Redis и Kafka, здесь пропускаются
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Версия Go берется из go.mod: единый источник правды
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Build
        run: go build ./...

  # Все тесты с настоящими PostgreSQL, Redis и Kafka из docker-compose.yml
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Поднимает инфраструктуру, создает топики и запускает go test с переменными TEST_*
      - name: Integration tests
        run: make test-integration

      # Если что-то упало, логи контейнеров покажут причину (например, отказ Kafka или базы)
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200

  # Сборка Docker-образа: проверяем, что Dockerfile рабочий и контейнер не запускается от root
  # Образ здесь только собирается и не публикуется: публикацию выполняет cd.yml
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Настраивает Buildx: без него Docker не может сохранять кеш слоев между запусками в хранилище GitHub Actions (type=gha)
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Копируем образ в Docker раннера: иначе docker run в шаге ниже его не увидит
          load: true
          tags: notification-service:ci
          # Аттестации сборки здесь не нужны и несовместимы с load
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Регрессионная проверка: пользователь внутри образа не root (его uid не равен 0)
      - name: Check that the container does not run as root
        run: |
          uid="$(docker run --rm --entrypoint id notification-service:ci -u)"
          echo "uid=${uid}"
          test "${uid}" != "0"