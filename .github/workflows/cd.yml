name: CD

# Запускается, когда workflow "CI" завершился на ветке main
# Публикует образ, только если CI прошел (условие в job ниже)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Права по умолчанию минимальные: только чтение репозитория
# Записывать пакеты в реестр может лишь задача публикации образа
permissions:
  contents: read

# Публикации идут по очереди: старая сборка, закончившаяся позже новой,
# не должна перезаписать тег latest
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  publish:
    # Только после успешного CI и только для push. Pull request сюда попадать не должны:
    # у запуска workflow_run повышенные права, а код в pull request чужой
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      # У запусков workflow_run переменная GITHUB_SHA указывает на последний коммит main,
      # а не на тот, который проверил CI
      # Берем именно проверенный коммит
      - name: Checkout the tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Теги: latest (подвижный) и sha-<7 символов коммита> (не перезаписывается)
      # Имя образа в нижнем регистре: реестр других не принимает
      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "list=${image}:latest,${image}:sha-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      # Вход в ghcr.io временным токеном запуска, личные токены не нужны
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # source связывает пакет с репозиторием, revision хранит коммит внутри образа
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          # Слои, собранные в CI, берутся из кеша, поэтому публикация быстрая
          cache-from: type=gha